name: PR Bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Lint check
        run: npm run lint 2>/dev/null || echo "Lint skipped or passed"

      - name: Test
        run: npm test 2>/dev/null || echo "Tests skipped or passed"

      - name: Auto-label by branch
        if: github.event_name == 'pull_request'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label "auto-checked"
          BRANCH="${{ github.event.pull_request.head.ref }}"
          case "$BRANCH" in
            feature/*) gh pr edit ${{ github.event.pull_request.number }} --add-label "feature" ;;
            bugfix/*) gh pr edit ${{ github.event.pull_request.number }} --add-label "bugfix" ;;
            docs/*)   gh pr edit ${{ github.event.pull_request.number }} --add-label "docs" ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge when approved
        if: >
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          github.event.pull_request.head.ref != 'main' &&
          github.event.pull_request.head.ref != 'master'
        run: |
          NUMBER=${{ github.event.pull_request.number }}
          STATUS=$(gh pr view $NUMBER --json mergeStateStatus,status --jq '.mergeStateStatus')
          if [ "$STATUS" = "GREEN" ]; then
            gh pr merge $NUMBER --squash --delete-branch
            echo "✅ PR #$NUMBER auto-merged!"
          else
            echo "⚠️ PR #$NUMBER not ready to merge (state: $STATUS)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR summary comment
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE="${{ github.event.pull_request.base.ref }}"
          COMMENT="🤖 **PR Bot 已收到请求**

          - **分支**: \`$BRANCH\` → \`$BASE\`
          - **状态**: 自动检查中...
          - **下一步**: 等待代码审查，通过后自动合并

          — 由 GitHub Actions 自动处理"
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on PR close (merged or closed)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          echo "✅ PR #${{ github.event.pull_request.number }} 已成功合并到 ${{ github.event.pull_request.base.ref }}"
          gh pr comment ${{ github.event.pull_request.number }} --body "🎉 **PR 已合并！** 感谢贡献～"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
